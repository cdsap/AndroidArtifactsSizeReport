name: Publish Gradle plugin

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-plugin:
    name: Publish Gradle plugin to the Plugin Portal
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be v<major>.<minor>.<patch>: $RELEASE_TAG" >&2
            exit 1
          fi

          version=$(./gradlew -p plugin :build-scan-artifact-size-reporter:properties -q \
            | awk -F': ' '$1 == "version" { print $2; exit }')
          if [[ -z "$version" || "$version" == *SNAPSHOT* ]]; then
            echo "Plugin version must be a non-snapshot release: '$version'" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match plugin version $version" >&2
            exit 1
          fi

      - name: Validate publication credentials
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          set -euo pipefail
          [[ -n "$GRADLE_PUBLISH_KEY" ]] || { echo "GRADLE_PUBLISH_KEY is not configured" >&2; exit 1; }
          [[ -n "$GRADLE_PUBLISH_SECRET" ]] || { echo "GRADLE_PUBLISH_SECRET is not configured" >&2; exit 1; }

      - name: Validate Plugin Portal publication
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew -p plugin :build-scan-artifact-size-reporter:publishPlugins --validate-only --no-daemon

      - name: Publish plugin to the Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew -p plugin :build-scan-artifact-size-reporter:publishPlugins --no-daemon
